tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
description: Returns a list of contacts with pagination and filtering.
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    required: false
    description: Page number for pagination
    schema:
      type: integer
      example: 1
  - name: perPage
    in: query
    required: false
    description: Number of contacts per page
    schema:
      type: integer
      example: 10
  - name: sortBy
    in: query
    required: false
    description: Field to sort by
    schema:
      type: string
      example: name
  - name: sortOrder
    in: query
    required: false
    description: Sort order (asc/desc)
    schema:
      type: string
      example: asc
  - name: type
    in: query
    required: false
    description: Contact type filter
    schema:
      type: string
      example: work
responses:
  '200':
    description: Successfully found contacts
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/contact.yaml'
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
                totalItems:
                  type: integer
                  example: 3
                totalPages:
                  type: integer
                  example: 1
                hasPreviousPage:
                  type: boolean
                  example: false
                hasNextPage:
                  type: boolean
                  example: false
        examples:
          success:
            value:
              status: 200
              message: Successfully found contacts!
              data:
                data:
                  - _id: '68c2e99d4c743b962b11edea'
                    name: 'John Doe'
