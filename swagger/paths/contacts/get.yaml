tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
description: Returns a list of contacts. Supports filtering and pagination.
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    required: false
    description: Page number for pagination
    schema:
      type: integer
      example: 1
  - name: limit
    in: query
    required: false
    description: Number of contacts per page
    schema:
      type: integer
      example: 20
  - name: favorite
    in: query
    required: false
    description: Filter by favorite status
    schema:
      type: boolean
      example: true
responses:
  '200':
    description: List of contacts
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../components/contact.yaml'
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: '../../components/error.yaml'
