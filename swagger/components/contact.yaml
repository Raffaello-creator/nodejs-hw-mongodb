type: object
properties:
  _id:
    type: string
    example: '60d21b4667d0d8992e610c85'
  name:
    type: string
    example: 'John Doe'
  phoneNumber:
    type: string
    example: '+1234567890'
  contactType:
    type: string
    example: 'work'
  photo:
    type: string
    format: binary
    description: Contact photo file
required:
  - name
  - phoneNumber
  - contactType
