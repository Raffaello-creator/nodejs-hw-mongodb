type: object
properties:
  _id:
    type: string
    example: '60d21b4667d0d8992e610c85'
  name:
    type: string
    example: 'John Doe'
  email:
    type: string
    example: 'john@example.com'
  phone:
    type: string
    example: '+1234567890'
  favorite:
    type: boolean
    example: false
required:
  - _id
  - name
  - email
  - phone
